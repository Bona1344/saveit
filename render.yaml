services:
  - type: web
    name: saveit-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TMP_DIR
        value: /app/tmp
      - key: CORS_ORIGIN
        value: https://saveit-ebon.vercel.app
